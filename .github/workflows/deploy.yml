name: Deploy Gewa Realty to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare public-only GitHub Pages build
        shell: bash
        run: |
          rm -rf src/app/api src/app/admin
          python - <<'PY'
          from pathlib import Path
          for path in Path('src/app').rglob('*.tsx'):
              text = path.read_text()
              text = text.replace('export const dynamic = "force-dynamic";', 'export const dynamic = "force-static";')
              path.write_text(text)
          PY

      - name: Build static website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: "https://satitech-official.github.io/gewa-reality-/"
        run: pnpm build

      - name: Fix all GitHub Pages public image paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('out')
          prefix = '/gewa-reality-'
          protected = '__GEWA_REPO_IMAGE_PATH__/'
          text_suffixes = {'.html', '.js', '.css', '.json', '.txt', '.xml', '.map'}
          changed_files = 0
          replacements = 0

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue

              # Protect paths Next has already prefixed, then fix only true
              # root-relative /images/... references. External URLs are untouched.
              text = text.replace(f'{prefix}/images/', protected)
              text, count = re.subn(
                  r'(?<![A-Za-z0-9.:])/images/',
                  f'{prefix}/images/',
                  text,
              )
              text = text.replace(protected, f'{prefix}/images/')

              if count:
                  path.write_text(text)
                  changed_files += 1
                  replacements += count

          print(f'Fixed {replacements} image references across {changed_files} generated files')

          # Validate that generated pages/chunks no longer contain broken
          # root-level image paths. Protect correct project-page paths first.
          bad = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              check = text.replace(f'{prefix}/images/', protected)
              if re.search(r'(?<![A-Za-z0-9.:])/images/', check):
                  bad.append(str(path))

          if bad:
              raise SystemExit('Broken root /images references remain in: ' + ', '.join(bad[:20]))
          PY

      - name: Validate GitHub Pages output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('out')
          if not (root / 'index.html').exists():
              raise SystemExit('Invalid Pages build: out/index.html missing')

          css = list((root / '_next' / 'static').rglob('*.css'))
          js = list((root / '_next' / 'static').rglob('*.js'))
          images = [p for p in (root / 'images').glob('*') if p.is_file()]

          if not css:
              raise SystemExit('Invalid Pages build: CSS assets missing')
          if not js:
              raise SystemExit('Invalid Pages build: JS assets missing')
          if not images:
              raise SystemExit('Invalid Pages build: public images missing')

          required = [
              'hero-goa.jpg',
              'about-goa.jpg',
              'villa-siolim.jpg',
              'apt-panjim.jpg',
              'villa-candolim.jpg',
              'commercial-margao.jpg',
              'plot-assagao.jpg',
              'plot-ponda.jpg',
          ]
          missing = [name for name in required if not (root / 'images' / name).exists()]
          if missing:
              raise SystemExit('Invalid Pages build: required images missing: ' + ', '.join(missing))

          # Validate representative public routes generated by the export.
          required_pages = [
              root / 'index.html',
              root / 'properties' / 'index.html',
              root / 'about' / 'index.html',
              root / 'locations' / 'index.html',
              root / 'property' / 'tropical-villa-siolim' / 'index.html',
              root / 'location' / 'siolim' / 'index.html',
          ]
          missing_pages = [str(path.relative_to(root)) for path in required_pages if not path.exists()]
          if missing_pages:
              raise SystemExit('Invalid Pages build: representative pages missing: ' + ', '.join(missing_pages))

          (root / '.nojekyll').touch()
          print(f'Validated: {len(css)} CSS, {len(js)} JS, {len(images)} image assets and representative routes')
          PY

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
